name: Build Grafisript Studio APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'GrafisriptStudio/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: GrafisriptStudio
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GrafisriptStudio-debug-apk
          path: GrafisriptStudio/app/build/outputs/apk/debug/app-debug.apk
