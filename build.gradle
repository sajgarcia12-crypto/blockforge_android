plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blockforge.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blockforge.studio'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
