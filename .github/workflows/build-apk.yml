
name: Build BlockForge APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          mkdir project
          unzip -q BlockForge_Android_Proyecto.zip -d project
          test -f project/BlockForge_Android/app/build.gradle

      - name: Install SDL2
        run: |
          P="$GITHUB_WORKSPACE/project/BlockForge_Android"
          curl -fL https://www.libsdl.org/release/SDL2-2.32.10.tar.gz -o /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C /tmp
          mv /tmp/SDL2-2.32.10 "$P/app/src/main/cpp/SDL"
          mkdir -p "$P/app/src/main/java/org/libsdl/app"
          cp -R "$P/app/src/main/cpp/SDL/android-project/app/src/main/java/org/libsdl/app/." "$P/app/src/main/java/org/libsdl/app/"
          sed -i 's/SDL2 SDL2main/SDL2/' "$P/app/src/main/cpp/CMakeLists.txt"

      - name: Build APK
        working-directory: project/BlockForge_Android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BlockForge-APK
          path: project/BlockForge_Android/app/build/outputs/apk/debug/a
          pp-debug.apk
