name: Build BlockForge APK
# Build de Android para BlockForge con firma persistente de actualizaciones.

on:
  workflow_dispatch:
  push:
    branches:
      - blockforge/dev-hub-foundation
      - blockforge/2d-review
      - blockforge/settings-panel
      - blockforge/godot-style-2d
      - blockforge/gameplay-sprite-studio

permissions:
  contents: read

concurrency:
  group: blockforge-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar backend Stripe (solo sintaxis)
        working-directory: backend
        run: |
          node --check src/server.js
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Instalar herramientas Android
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verificar Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          sdkmanager --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Instalar Gradle
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verificar Gradle
        run: gradle --version

      - name: Extraer proyecto BlockForge
        run: |
          set -e
          test -f BlockForge_Android_Proyecto.zip
          mkdir -p project
          unzip -q BlockForge_Android_Proyecto.zip -d project
          P="$GITHUB_WORKSPACE/project/BlockForge_Android"
          test -f "$P/settings.gradle"
          test -f "$P/app/build.gradle"
          test -f "$P/app/src/main/cpp/CMakeLists.txt"
          sed -i "s/versionCode 1/versionCode 3/; s/versionName '0.1.0'/versionName '0.3.0'/" "$P/app/build.gradle"
          grep -q "applicationId 'com.blockforge.studio'" "$P/app/build.gradle"
          grep -q "versionCode 3" "$P/app/build.gradle"

      - name: Configurar firma permanente de BlockForge
        env:
          BLOCKFORGE_KEYSTORE_BASE64: ${{ secrets.BLOCKFORGE_KEYSTORE_BASE64 }}
          BLOCKFORGE_STORE_PASSWORD: ${{ secrets.BLOCKFORGE_STORE_PASSWORD }}
          BLOCKFORGE_KEY_ALIAS: ${{ secrets.BLOCKFORGE_KEY_ALIAS }}
          BLOCKFORGE_KEY_PASSWORD: ${{ secrets.BLOCKFORGE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${BLOCKFORGE_KEYSTORE_BASE64:?Falta el secreto BLOCKFORGE_KEYSTORE_BASE64}"
          : "${BLOCKFORGE_STORE_PASSWORD:?Falta el secreto BLOCKFORGE_STORE_PASSWORD}"
          : "${BLOCKFORGE_KEY_ALIAS:?Falta el secreto BLOCKFORGE_KEY_ALIAS}"
          : "${BLOCKFORGE_KEY_PASSWORD:?Falta el secreto BLOCKFORGE_KEY_PASSWORD}"
          P="$GITHUB_WORKSPACE/project/BlockForge_Android"
          echo "$BLOCKFORGE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/blockforge-release.jks"
          test -s "$RUNNER_TEMP/blockforge-release.jks"
          # Make the keystore path available to the separate Gradle build step.
          echo "BLOCKFORGE_KEYSTORE_FILE=$RUNNER_TEMP/blockforge-release.jks" >> "$GITHUB_ENV"
          # Fail here with a clear message if the keystore/password/alias do not match.
          keytool -list -keystore "$RUNNER_TEMP/blockforge-release.jks" \
            -storepass "$BLOCKFORGE_STORE_PASSWORD" \
            -alias "$BLOCKFORGE_KEY_ALIAS" >/dev/null
          cat >> "$P/app/build.gradle" <<'GRADLE'

          // Permanent BlockForge signing identity. Keep this key for every future update.
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("BLOCKFORGE_KEYSTORE_FILE"))
                      storePassword System.getenv("BLOCKFORGE_STORE_PASSWORD")
                      keyAlias System.getenv("BLOCKFORGE_KEY_ALIAS")
                      keyPassword System.getenv("BLOCKFORGE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
        shell: bash

      - name: Crear icono original de BlockForge
        run: |
          set -e
          python3 -m pip install --quiet --break-system-packages pillow
          P="$GITHUB_WORKSPACE/project/BlockForge_Android"
          python3 - "$P/app/src/main/res" <<'PY'
          from PIL import Image, ImageDraw
          import os, sys, math, xml.etree.ElementTree as ET
          root=sys.argv[1]
          sizes={"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density,size in sizes.items():
              folder=os.path.join(root,"mipmap-"+density)
              os.makedirs(folder,exist_ok=True)
              im=Image.new("RGBA",(size,size),(10,17,31,255))
              d=ImageDraw.Draw(im)
              cx=cy=size/2
              r=size*.39
              pts=[(cx+math.cos(math.radians(60*i-30))*r,cy+math.sin(math.radians(60*i-30))*r) for i in range(6)]
              d.polygon(pts,fill=(31,105,190,255),outline=(92,205,255,255),width=max(1,size//28))
              unit=size/12
              blocks=[(4,3,8,4),(4,4,5,9),(5,5,8,6),(6,7,8,8)]
              for x1,y1,x2,y2 in blocks:
                  d.rectangle((x1*unit,y1*unit,x2*unit,y2*unit),fill=(235,248,255,255))
              im.save(os.path.join(folder,"ic_launcher.png"))
              im.save(os.path.join(folder,"ic_launcher_round.png"))
          manifest=os.path.join(root,"..","AndroidManifest.xml")
          tree=ET.parse(manifest)
          app=tree.getroot().find("application")
          ns="{http://schemas.android.com/apk/res/android}"
          app.set(ns+"icon","@mipmap/ic_launcher")
          app.set(ns+"roundIcon","@mipmap/ic_launcher_round")
          tree.write(manifest,encoding="utf-8",xml_declaration=True)
          print("BlockForge launcher icon installed in manifest")
          PY

      - name: Copiar nueva interfaz BlockForge
        run: |
          set -e
          P="$GITHUB_WORKSPACE/project/BlockForge_Android"
          SOURCE="$GITHUB_WORKSPACE/BlockForgeActivity.java"
          test -f "$SOURCE"
          PACKAGE=$(sed -n 's/^package[[:space:]]\+\([^;]*\);.*/\1/p' "$SOURCE" | head -n 1)
          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No se encontró el package de BlockForgeActivity.java"
            exit 1
          fi
          PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')
          DEST="$P/app/src/main/java/$PACKAGE_PATH/BlockForgeActivity.java"
          mkdir -p "$(dirname "$DEST")"
          cp "$SOURCE" "$DEST"
          echo "Interfaz copiada a: $DEST"
          test -f "$DEST"

      - name: Descargar e instalar SDL2
        run: |
          set -e
          P="$GITHUB_WORKSPACE/project/BlockForge_Android"
          mkdir -p "$P/app/src/main/cpp"
          curl -fL https://www.libsdl.org/release/SDL2-2.32.10.tar.gz -o /tmp/sdl.tar.gz
          tar -xzf /tmp/sdl.tar.gz -C /tmp
          rm -rf "$P/app/src/main/cpp/SDL"
          mv /tmp/SDL2-2.32.10 "$P/app/src/main/cpp/SDL"
          SDL_JAVA="$P/app/src/main/cpp/SDL/android-project/app/src/main/java/org/libsdl/app"
          test -d "$SDL_JAVA"
          mkdir -p "$P/app/src/main/java/org/libsdl/app"
          cp -R "$SDL_JAVA/." "$P/app/src/main/java/org/libsdl/app/"
          sed -i 's/SDL2 SDL2main/SDL2/g' "$P/app/src/main/cpp/CMakeLists.txt"
          test -f "$P/app/src/main/java/org/libsdl/app/SDLActivity.java"

      - name: Compilar BlockForge APK firmado
        working-directory: project/BlockForge_Android
        env:
          BLOCKFORGE_KEYSTORE_FILE: ${{ runner.temp }}/blockforge-release.jks
          BLOCKFORGE_STORE_PASSWORD: ${{ secrets.BLOCKFORGE_STORE_PASSWORD }}
          BLOCKFORGE_KEY_ALIAS: ${{ secrets.BLOCKFORGE_KEY_ALIAS }}
          BLOCKFORGE_KEY_PASSWORD: ${{ secrets.BLOCKFORGE_KEY_PASSWORD }}
        run: |
          set -e
          for attempt in 1 2 3; do
            if gradle --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle falló; reintentando en $((attempt * 30)) segundos..."
              sleep $((attempt * 30))
            fi
          done
          echo "La compilación falló después de 3 intentos"
          exit 1

      - name: Verificar APK y firma
        run: |
          set -e
          APK="project/BlockForge_Android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockForge-APK
          path: project/BlockForge_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
