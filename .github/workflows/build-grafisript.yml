name: Build Grafisript Studio APK
on:
  workflow_dispatch:
  push:
    branches:
      - grafisript-studio-app
    paths:
      - 'GrafisriptStudio/**'
      - '.github/workflows/build-grafisript.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: GrafisriptStudio
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GrafisriptStudio-debug-apk
          path: GrafisriptStudio/app/build/outputs/apk/debug/app-debug.apk
